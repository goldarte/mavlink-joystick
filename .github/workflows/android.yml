name: Android CI

on:
  push:
    # '**' matches every branch and every tag. Both filters must be declared:
    # defining only one of them stops the workflow from running for the other
    # kind of ref. Path filters are never evaluated for pushes of tags, so a tag
    # always builds regardless of what the commit changed.
    branches: ['**']
    tags: ['**']
    paths-ignore:
      - '**/*.md'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
  # Publishing a release or a pre-release - from the GitHub UI or with
  # `gh release create` - attaches the APK of the run that built that tag.
  # This workflow never builds during a release and never publishes releases
  # itself: publishing stays manual.
  release:
    types: [published]
  # Manual run from the Actions tab or the API. Leave "ref" empty to build the
  # branch or tag selected in the UI, or type any commit SHA to build exactly
  # that commit.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build (empty = the ref selected in the UI)'
        required: false
        type: string
      attach_tag:
        description: 'Attach the artifacts of an already built tag to its release instead of building (e.g. v2.0-rc2)'
        required: false
        type: string

# A newer push to the same branch or pull request cancels the builds still running.
# The event name is part of the group so that publishing a release does not
# cancel the build that pushing its tag started.
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the APK
    # A release event has nothing to build: see "attach" below. A manual run that
    # only asks to attach artifacts does not build either.
    if: github.event_name != 'release' && !inputs.attach_tag
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A manual run can name any commit; every other event builds the ref
          # that triggered the workflow.
          ref: ${{ inputs.ref || github.ref }}

      - name: Show the commit being built
        run: git log -1 --format='%H %s'

      # gradle/gradle-daemon-jvm.properties pins the Gradle daemon JVM to 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle User Home between runs.
      # "basic" is the MIT-licensed cache implementation; the action's default
      # ("enhanced") is faster but ships a proprietary component under
      # https://gradle.com/legal/terms-of-use/ and is free for public repos.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Release signing material comes from repository secrets. BUILD.md
      # documents the matching RELEASE_* variables that the Gradle build reads
      # (androidApp/build.gradle.kts):
      #   RELEASE_KEYSTORE_BASE64 -> the keystore file, base64-encoded (a secret,
      #                              because the keystore itself is gitignored)
      #   RELEASE_STORE_PASSWORD  -> storePassword
      #   RELEASE_KEY_ALIAS       -> keyAlias
      #   RELEASE_KEY_PASSWORD    -> keyPassword
      # When the secrets are absent - pull requests from forks never receive
      # them - the release APK is built unsigned instead of failing.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set: the release APK will be unsigned."
            echo "store-file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r' | base64 --decode > "$KEYSTORE"
          echo "store-file=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "Decoded the release keystore into the runner's temporary directory."

      # The Android SDK (platform 37, build-tools 37.0.0) ships with the runner
      # image, and AGP accepts the SDK licences already present there.
      #
      # :androidApp:preBuild depends on :shared:localTests, so the shared
      # multiplatform unit tests run - and must pass - as part of this build.
      # A signed release APK is written to mavlink-joystick.apk, an unsigned one
      # to mavlink-joystick-unsigned.apk.
      - name: Build the release APK
        env:
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      # The APK is the only build output. Its file name is what the artifact is
      # called and what the release asset is called, so it is resolved once here.
      - name: Locate the APK
        id: apk
        run: |
          APK=androidApp/build/outputs/apk/release/mavlink-joystick.apk
          if [ -f "$APK" ]; then
            echo "Release APK is signed."
          else
            APK=androidApp/build/outputs/apk/release/mavlink-joystick-unsigned.apk
            echo "::warning::The release APK is unsigned: signing secrets were not available."
          fi
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # "archive: false" stores the APK as a plain file instead of wrapping it in
      # a zip. The artifact is then named after the file, so it shows up as
      # mavlink-joystick.apk (or mavlink-joystick-unsigned.apk). The release job
      # below finds it again by that name.
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error

  attach:
    name: Attach the APK to the release
    # Publishing a release does not rebuild anything: the tag was already built
    # by the push run, and this job moves that run's artifact onto the release.
    # A manual run with "attach_tag" set reaches the same job, which is the way
    # to attach assets to a release that was published from a tag whose own
    # workflow was broken or out of date.
    if: github.event_name == 'release' || inputs.attach_tag
    runs-on: ubuntu-latest
    # Waiting for the tag build to finish dominates; see the loop below.
    timeout-minutes: 40
    permissions:
      # A job-level block replaces the workflow-level permissions, so only what
      # this job needs is listed: release assets and the other run's artifacts.
      contents: write
      actions: read
    # There is no checkout in this job, so gh cannot infer the repository from a
    # git remote and would fail with "not a git repository". GH_REPO tells it
    # which repository to talk to.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.attach_tag }}
    steps:
      - name: Find the run that built the release commit
        id: run
        run: |
          # Resolve the tag to its commit through the API rather than trusting
          # GITHUB_SHA: on a release event GITHUB_SHA is the tagged commit, but a
          # manual run checks out whatever ref was selected in the UI.
          SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          # The push run that built that commit is the one to take the artifact
          # from. A branch push of the same commit produces an identical APK, so
          # it is accepted too - what matters is the commit, not the ref.
          # Publishing a release right after pushing a tag is common, so wait for
          # the build instead of failing: 60 attempts, 30 seconds apart.
          RUNS_URL="repos/$GH_REPO/actions/workflows/android.yml/runs?event=push&head_sha=$SHA&per_page=20"
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUNS=$(gh api "$RUNS_URL")
            RUN_ID=$(printf '%s' "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // ""')
            if [ -n "$RUN_ID" ]; then
              break
            fi
            # Nothing successful yet. If every run for this commit has finished
            # without success, waiting longer cannot help.
            if printf '%s' "$RUNS" | jq -e '(.workflow_runs | length) > 0 and all(.workflow_runs[]; .status == "completed")' > /dev/null; then
              echo "::error::No successful build of $SHA. Check the tag build in the Actions tab, then re-run this job."
              exit 1
            fi
            echo "Waiting for the build of $SHA to finish (attempt $attempt/60)..."
            sleep 30
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for a successful build of $SHA."
            exit 1
          fi
          # The artifact of an unarchived upload is named after its file.
          ARTIFACT=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[].name | select(startswith("mavlink-joystick") and endswith(".apk"))][0] // ""')
          if [ -z "$ARTIFACT" ]; then
            echo "::error::Run $RUN_ID has no mavlink-joystick APK artifact (it may have expired)."
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Taking $ARTIFACT from run $RUN_ID."

      # download-artifact v8 is the first release that can fetch artifacts
      # uploaded with "archive: false"; v7 would try to unzip them.
      - name: Download the APK from that run
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.run.outputs.artifact }}
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release

      # Release assets are plain files, so the APK is attached as-is, without a
      # zip. An asset with the same name from an earlier attempt is replaced.
      - name: Attach the APK to the release
        run: |
          APK=$(find "$RUNNER_TEMP/release" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          # GH_REPO already tells gh which repository to use; -R repeats it on
          # the command itself, so no git remote is ever consulted.
          gh release view "$TAG" -R "$GH_REPO" > /dev/null
          gh release upload "$TAG" "$APK" --clobber -R "$GH_REPO"
          echo "::notice::Attached $(basename "$APK") to the release $TAG."
