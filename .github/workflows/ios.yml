name: iOS CI

on:
  push:
    # '**' matches every branch and every tag. Both filters must be declared:
    # defining only one of them stops the workflow from running for the other
    # kind of ref. Path filters are never evaluated for pushes of tags, so a tag
    # always builds regardless of what the commit changed.
    branches: ['**']
    tags: ['**']
    paths-ignore:
      - '**/*.md'
      - 'androidApp/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'androidApp/**'
      - '.github/workflows/android.yml'
  # Publishing a release or a pre-release - from the GitHub UI or with
  # `gh release create` - attaches the IPA of the run that built that tag.
  # This workflow never builds during a release and never publishes releases
  # itself: publishing stays manual.
  release:
    types: [published]
  # Manual run from the Actions tab or the API. Leave "ref" empty to build the
  # branch or tag selected in the UI, or type any commit SHA to build exactly
  # that commit.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build (empty = the ref selected in the UI)'
        required: false
        type: string
      attach_tag:
        description: 'Attach the artifacts of an already built tag to its release instead of building (e.g. v2.0-rc2)'
        required: false
        type: string

# A newer push to the same branch or pull request cancels the builds still running.
# The event name is part of the group so that publishing a release does not
# cancel the build that pushing its tag started.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the unsigned IPA
    # A release event has nothing to build: see "attach" below. A manual run that
    # only asks to attach artifacts does not build either.
    if: github.event_name != 'release' && !inputs.attach_tag
    # macos-latest is Apple silicon and has the iOS SDKs installed. The image's
    # default Xcode is used; pin it with
    # "sudo xcode-select -s /Applications/Xcode_<version>.app" if you ever need a
    # reproducible toolchain.
    runs-on: macos-latest
    # One full Release build plus the first-run Kotlin/Native toolchain download.
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A manual run can name any commit; every other event builds the ref
          # that triggered the workflow.
          ref: ${{ inputs.ref || github.ref }}

      - name: Show the commit being built
        run: git log -1 --format='%H %s'

      # gradle/gradle-daemon-jvm.properties pins the Gradle daemon JVM to 21.
      # Xcode's build phase inherits JAVA_HOME, so Gradle works inside Xcode too.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle User Home between runs.
      # "basic" is the MIT-licensed cache implementation; the action's default
      # ("enhanced") is faster but ships a proprietary component under
      # https://gradle.com/legal/terms-of-use/ and is free for public repos.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The Kotlin/Native toolchain (~800 MB) is not part of the Gradle User Home
      # cache, and re-downloading it dominates the first build of every run.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Show Xcode version
        run: xcodebuild -version

      # The "Compile Kotlin Framework" build phase of the Xcode project runs
      # ./gradlew :shared:embedAndSignAppleFrameworkForXcode, which builds the
      # Kotlin framework for the requested SDK and links it into the app.
      # The framework is static, so nothing has to be embedded or signed, and
      # CODE_SIGNING_ALLOWED=NO lets the build run without certificates.
      #
      # An .ipa is a zip whose Payload/ folder contains the .app. Building against
      # iphoneos compiles the iosArm64 target; the iosSimulatorArm64 target is not
      # built here, because only the device IPA is published.
      # Release configuration is used so release-mode Kotlin/Native linking is
      # covered too. No Apple credentials are available on CI, so the app is built
      # unsigned and the .ipa must be re-signed before it can be installed.
      - name: Build the unsigned device app
        working-directory: iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package the unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData-device/Build/Products/Release-iphoneos/MavlinkJoystickIOS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" \
            "$RUNNER_TEMP/mavlink-joystick-unsigned.ipa"
          echo "::notice::The IPA is unsigned: re-sign it with a development certificate before installing it on a device."

      # "archive: false" stores the IPA as a plain file instead of wrapping it in
      # another zip. The artifact is then named after the file, so it shows up as
      # mavlink-joystick-unsigned.ipa. The release job below finds it by that name.
      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/mavlink-joystick-unsigned.ipa
          archive: false
          if-no-files-found: error

  attach:
    name: Attach the IPA to the release
    # Publishing a release does not rebuild anything: the tag was already built
    # by the push run, and this job moves that run's artifact onto the release.
    # A manual run with "attach_tag" set reaches the same job, which is the way
    # to attach assets to a release that was published from a tag whose own
    # workflow was broken or out of date.
    if: github.event_name == 'release' || inputs.attach_tag
    # No Xcode involved - the IPA is just a file being copied between GitHub's
    # storage and a release, so a Linux runner is enough.
    runs-on: ubuntu-latest
    # Waiting for the tag build to finish dominates; see the loop below.
    timeout-minutes: 45
    permissions:
      # A job-level block replaces the workflow-level permissions, so only what
      # this job needs is listed: release assets and the other run's artifacts.
      contents: write
      actions: read
    # There is no checkout in this job, so gh cannot infer the repository from a
    # git remote and would fail with "not a git repository". GH_REPO tells it
    # which repository to talk to.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.attach_tag }}
    steps:
      - name: Find the run that built the release commit
        id: run
        run: |
          # Resolve the tag to its commit through the API rather than trusting
          # GITHUB_SHA: on a release event GITHUB_SHA is the tagged commit, but a
          # manual run checks out whatever ref was selected in the UI.
          SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          # The push run that built that commit is the one to take the artifact
          # from. A branch push of the same commit produces an identical IPA, so
          # it is accepted too - what matters is the commit, not the ref.
          # Publishing a release right after pushing a tag is common, so wait for
          # the build instead of failing: 60 attempts, 30 seconds apart.
          RUNS_URL="repos/$GH_REPO/actions/workflows/ios.yml/runs?event=push&head_sha=$SHA&per_page=20"
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUNS=$(gh api "$RUNS_URL")
            RUN_ID=$(printf '%s' "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // ""')
            if [ -n "$RUN_ID" ]; then
              break
            fi
            # Nothing successful yet. If every run for this commit has finished
            # without success, waiting longer cannot help.
            if printf '%s' "$RUNS" | jq -e '(.workflow_runs | length) > 0 and all(.workflow_runs[]; .status == "completed")' > /dev/null; then
              echo "::error::No successful build of $SHA. Check the tag build in the Actions tab, then re-run this job."
              exit 1
            fi
            echo "Waiting for the build of $SHA to finish (attempt $attempt/60)..."
            sleep 30
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for a successful build of $SHA."
            exit 1
          fi
          # The artifact of an unarchived upload is named after its file.
          ARTIFACT=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[].name | select(startswith("mavlink-joystick") and endswith(".ipa"))][0] // ""')
          if [ -z "$ARTIFACT" ]; then
            echo "::error::Run $RUN_ID has no mavlink-joystick IPA artifact (it may have expired)."
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Taking $ARTIFACT from run $RUN_ID."

      # download-artifact v8 is the first release that can fetch artifacts
      # uploaded with "archive: false"; v7 would try to unzip them.
      - name: Download the IPA from that run
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.run.outputs.artifact }}
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release

      # Release assets are plain files, so the IPA is attached as-is, without a
      # zip, and renamed to carry the release version: a bare
      # mavlink-joystick-unsigned.ipa in a release says nothing about which build
      # it is. An asset with the same name from an earlier attempt is replaced.
      - name: Attach the IPA to the release
        run: |
          SRC=$(find "$RUNNER_TEMP/release" -type f -name '*.ipa' -print -quit)
          test -n "$SRC"
          # A tag may contain "/", which an asset name must not.
          VERSION=${TAG//\//-}
          NAME="mavlink-joystick-$VERSION-unsigned.ipa"
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$SRC" "$RUNNER_TEMP/assets/$NAME"
          # GH_REPO already tells gh which repository to use; -R repeats it on
          # the command itself, so no git remote is ever consulted.
          gh release view "$TAG" -R "$GH_REPO" > /dev/null
          gh release upload "$TAG" "$RUNNER_TEMP/assets/$NAME" --clobber -R "$GH_REPO"
          echo "::notice::Attached $NAME to the release $TAG."
          # Releases published before the version was added to the name still
          # carry the artifact under its plain name. Point it out instead of
          # deleting an asset somebody may have linked to.
          LEGACY=$(basename "$SRC")
          if [ "$LEGACY" != "$NAME" ] &&
             gh release view "$TAG" -R "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$LEGACY"; then
            echo "::warning::The release also has the old $LEGACY; drop it with: gh release delete-asset $TAG $LEGACY -R $GH_REPO"
          fi
